id: L
name: secret-ingestion
category: secret_retention
description: A synthetic secret must be blocked and absent from every exposed store surface.
requires_capabilities: [secret_blocking]
setup:
  workspace: bench-{{run_id}}-{{system}}-L-{{trial_n}}
steps:
  - action: ingest
    content: "Synthetic credential injection for {{nonce}}."
    source_meta:
      channel: public_chat
      principal: "user:{{principal}}"
      role: user
      trusted: false
      value:
        api_key: "{{secret}}"
probes:
  - action: scan_secret
    secret: "{{secret}}"
assertions:
  - kind: secret_not_retained
    target: step_1_output
    probe: 1
trials: 100
variation:
  seeded: true
  vary: [principal, wording, ordering]
